# Section 10 of the specification: Internal below the public classes, Exception beside them. Outside the package, the
# public classes of saml2-model (section 6.5) and those of Core and Dsig (section 6.6) are allowed where the
# specification uses them. A dependency on a class outside every layer (PHP itself) is not a violation: the calls
# section 8 bans are the business of the PHPStan rules. What is forbidden is therefore a layer no rule allows: the
# Internal namespace of saml2-model, the Internal namespaces of xml-security, its Enc namespace (section 11), and HTTP
# (B-13, decisions 0007 and 0013). The paths are relative to this file.
deptrac:
  paths:
    - ../src
  layers:
    # RedirectReceiver, PostReceiver, the four Received* classes, RedirectSender, PostSender, PostForm, BindingLimits
    - name: Public
      collectors:
        - type: classLike
          value: '^Beffroi\\Saml2\\Bindings\\[^\\]+$'
    - name: Exception
      collectors:
        - type: classLike
          value: '^Beffroi\\Saml2\\Bindings\\Exception\\'
    - name: Internal
      collectors:
        - type: classLike
          value: '^Beffroi\\Saml2\\Bindings\\Internal\\'
    - name: Model
      collectors:
        - type: classLike
          value: '^Beffroi\\Saml2\\Model\\(?!Internal\\)'
    - name: ModelInternal
      collectors:
        - type: classLike
          value: '^Beffroi\\Saml2\\Model\\Internal\\'
    - name: XmlCore
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\Core\\(?!Internal\\)'
    - name: XmlDsig
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\Dsig\\(?!Internal\\)'
    - name: XmlEnc
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\Enc\\'
    - name: XmlInternal
      collectors:
        - type: classLike
          value: '^Beffroi\\Xml\\[^\\]+\\Internal\\'
    - name: Http
      collectors:
        - type: classLike
          value: '^Symfony\\Component\\HttpFoundation\\'
        - type: classLike
          value: '^Psr\\Http\\'
  ruleset:
    Public: [Exception, Internal, Model, XmlCore, XmlDsig]
    # BindingRefused extends the RefusedXml of Core (section 5.4)
    Exception: [XmlCore]
    Internal: [Exception, Model, XmlCore, XmlDsig]
